<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방과후 조리실 냉장고 요정</title>
<style>
  :root {
    --bg: #f5f7f3;
    --card: #ffffff;
    --text: #1f2a24;
    --muted: #6b756f;
    --line: #e2e6e0;
    --primary: #2f7d5b;
    --primary-dark: #236246;
    --primary-soft: #e6f2ec;
    --danger: #b3261e;
    --danger-bg: #fdecea;
    --ok: #3a9a5b;
    --ok-bg: #e5f4ea;
    --ok-text: #1f6b3a;
    --soon: #f2c200;
    --soon-bg: #fff8dc;
    --soon-text: #6b5000;
    --shadow: 0 2px 10px rgba(31, 42, 36, 0.08);
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    line-height: 1.5;
  }

  button, input, select { font: inherit; }

  /* ---------- 상단 ---------- */
  header {
    background: var(--primary);
    color: #fff;
    padding: 20px 24px;
  }
  header .inner {
    max-width: 1280px;
    margin: 0 auto;
  }
  header h1 {
    margin: 0;
    font-size: 26px;
  }
  header p {
    margin: 4px 0 0;
    opacity: 0.85;
    font-size: 15px;
  }

  /* ---------- 본문 2단 배치 ---------- */
  .layout {
    display: grid;
    grid-template-columns: minmax(320px, 1fr) minmax(420px, 1.3fr);
    gap: 24px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 24px 120px;
    align-items: start;
  }

  .panel {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
  }
  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .panel h2 {
    margin: 0;
    font-size: 21px;
  }
  .panel-sub {
    color: var(--muted);
    font-size: 15px;
  }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 36px 12px;
    margin: 0;
  }

  /* ---------- 재료 목록 ---------- */
  .cat + .cat { margin-top: 18px; }
  .cat h3 {
    margin: 0 0 8px;
    font-size: 17px;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cat h3 .count {
    background: var(--primary-soft);
    color: var(--primary-dark);
    font-size: 13px;
    border-radius: 999px;
    padding: 1px 9px;
  }
  .cat ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .item + .item { margin-top: 6px; }
  .item-main {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 14px;
    min-width: 0;
  }
  .item-name {
    font-weight: 700;
    word-break: break-all;
  }
  .item-date {
    color: var(--muted);
    font-size: 15px;
  }
  .item-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  /* ---------- 소비기한 상태 색상 ---------- */
  .item.ok { border-left: 6px solid var(--ok); }
  .item.soon {
    border-left: 6px solid var(--soon);
    background: var(--soon-bg);
  }
  .item.expired {
    border: 2px solid var(--danger);
    border-left-width: 6px;
    background: var(--danger-bg);
  }
  .item.expired .item-name { color: var(--danger); }

  .badge {
    font-size: 14px;
    font-weight: 700;
    border-radius: 999px;
    padding: 1px 10px;
    white-space: nowrap;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok-text); }
  .badge.soon { background: var(--soon); color: var(--soon-text); }
  .badge.expired { background: var(--danger); color: #fff; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    color: var(--muted);
    font-size: 14px;
    margin: -4px 0 14px;
  }
  .legend span::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: 0;
  }
  .legend .ok::before { background: var(--ok); }
  .legend .soon::before { background: var(--soon); }
  .legend .expired::before { background: var(--danger); }

  /* ---------- 기한 경과 경고 배너 ---------- */
  .banner-wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 24px 0;
  }
  .banner-wrap[hidden] { display: none; }
  .banner {
    background: var(--danger);
    color: #fff;
    border-radius: var(--radius);
    padding: 14px 20px;
    font-weight: 700;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 12px;
    box-shadow: var(--shadow);
  }
  .banner-count {
    background: #fff;
    color: var(--danger);
    border-radius: 999px;
    padding: 1px 12px;
    font-size: 15px;
  }

  /* ---------- 버튼 ---------- */
  .btn {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    font-weight: 700;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-plain { background: #eef0ec; color: var(--text); }
  .btn-plain:hover { background: #e2e5df; }

  .btn-ghost {
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 12px;
    cursor: pointer;
    color: var(--text);
    font-size: 15px;
  }
  .btn-ghost:hover { background: #f1f3ef; }
  .btn-ghost.danger { color: var(--danger); }

  .btn-discard {
    background: var(--danger);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
  }
  .btn-discard:hover { background: #8f1d17; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #8f1d17; }

  .fab {
    position: fixed;
    right: 28px;
    bottom: 28px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 36px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(31, 42, 36, 0.3);
  }
  .fab:hover { background: var(--primary-dark); }

  /* ---------- 입력 창 ---------- */
  dialog {
    border: none;
    border-radius: var(--radius);
    padding: 0;
    width: min(460px, calc(100vw - 32px));
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
  }
  dialog::backdrop { background: rgba(20, 30, 25, 0.45); }
  dialog form { padding: 22px 24px; }
  dialog h2 { margin: 0 0 16px; font-size: 21px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .field input,
  .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cfd5cd;
    border-radius: 10px;
    background: #fff;
    color: var(--text);
  }
  .field input:focus,
  .field select:focus {
    outline: 2px solid var(--primary);
    outline-offset: 1px;
  }
  .form-error {
    color: var(--danger);
    font-size: 15px;
    min-height: 1.5em;
    margin: 0 0 6px;
  }
  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .confirm-body { padding: 22px 24px; }
  .confirm-body p {
    margin: 0 0 20px;
    white-space: pre-line;
    font-size: 18px;
  }

  /* ---------- 알림 ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: #2b332e;
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- 좁은 화면 ---------- */
  @media (max-width: 900px) {
    .layout {
      grid-template-columns: 1fr;
      padding: 16px 16px 110px;
    }
    header { padding: 16px; }
    .banner-wrap { padding: 16px 16px 0; }
    .fab { right: 16px; bottom: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1>🧚 방과후 조리실 냉장고 요정</h1>
    <p>냉장고 재료와 실습 레시피를 한눈에 관리해요. 모든 정보는 이 컴퓨터의 브라우저에만 저장됩니다.</p>
  </div>
</header>

<!-- 기한 지난 재료가 있을 때만 보이는 경고 -->
<div class="banner-wrap" id="expiredBanner" hidden>
  <div class="banner" role="alert">
    <span>⚠️ 소비기한이 지난 재료는 위생 안전을 위해 확인 후 즉시 폐기하세요.</span>
    <span class="banner-count" id="expiredCount"></span>
  </div>
</div>

<main class="layout">
  <!-- 왼쪽: 추천 요리 (3단계에서 채움) -->
  <section class="panel" id="recommendPanel">
    <div class="panel-head">
      <h2>🍳 추천 요리</h2>
    </div>
    <p class="empty">레시피 등록과 요리 추천 기능은<br>다음 단계에서 추가됩니다.</p>
  </section>

  <!-- 오른쪽: 냉장고 재료 -->
  <section class="panel" id="ingredientPanel">
    <div class="panel-head">
      <h2>🧊 냉장고 재료</h2>
      <span class="panel-sub" id="ingredientCount"></span>
    </div>
    <div class="legend">
      <span class="ok">7일 이상 남음</span>
      <span class="soon">6일 이내 임박</span>
      <span class="expired">기한 지남</span>
    </div>
    <div id="ingredientList"></div>
  </section>
</main>

<button class="fab" id="fab" type="button" aria-label="재료 추가" title="재료 추가">＋</button>

<!-- 재료 추가/수정 창 -->
<dialog id="ingredientDialog">
  <form id="ingredientForm" novalidate>
    <h2 id="ingredientDialogTitle">재료 추가</h2>
    <div class="field">
      <label for="ingName">재료명</label>
      <input id="ingName" type="text" maxlength="30" placeholder="예: 양파" autocomplete="off">
    </div>
    <div class="field">
      <label for="ingCategory">카테고리</label>
      <select id="ingCategory"></select>
    </div>
    <div class="field">
      <label for="ingExpiry">소비기한</label>
      <input id="ingExpiry" type="date">
    </div>
    <p class="form-error" id="ingError"></p>
    <div class="form-actions">
      <button class="btn btn-plain" type="button" id="ingCancel">취소</button>
      <button class="btn btn-primary" type="submit">저장</button>
    </div>
  </form>
</dialog>

<!-- 삭제/폐기 확인 창 -->
<dialog id="confirmDialog">
  <div class="confirm-body">
    <p id="confirmMessage"></p>
    <div class="form-actions">
      <button class="btn btn-plain" type="button" id="confirmCancel">취소</button>
      <button class="btn btn-danger" type="button" id="confirmOk">확인</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
  const STORAGE_KEY = 'fridgeFairy.v1';
  const CATEGORIES = [
    '채소·과일', '육류·해산물', '달걀·두부', '유제품', '곡류·면·빵',
    '가공식품', '소스·장류', '냉동식품', '기타'
  ];
  const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
  const SOON_DAYS = 6; // 오늘부터 이 날수 이내로 남으면 노란색
  // 이 범위를 벗어난 소비기한은 연도 오타일 수 있어 저장 전에 한 번 더 묻는다
  const CHECK_FUTURE_DAYS = 365 * 3;
  const CHECK_PAST_DAYS = 30;

  const $ = (sel) => document.querySelector(sel);

  // ---------- 저장소 ----------
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        return {
          ingredients: Array.isArray(data.ingredients) ? data.ingredients : [],
          recipes: Array.isArray(data.recipes) ? data.recipes : []
        };
      }
    } catch (e) { /* 읽기 실패 시 빈 상태로 시작 */ }
    return { ingredients: [], recipes: [] };
  }

  // 변경을 적용하고 저장한다. 저장에 실패하면 변경 전 상태로 되돌린다.
  function commit(change) {
    const backup = JSON.stringify(state);
    change();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    } catch (e) {
      state = JSON.parse(backup);
      alert('저장에 실패해서 방금 바꾼 내용을 되돌렸어요.\n브라우저 설정에서 사이트 데이터 저장이 막혀 있는지 확인해 주세요.');
      return false;
    }
  }

  let state = load();

  // 같은 앱을 다른 탭에서 바꾸면 이 탭도 최신 데이터로 다시 읽는다 (덮어쓰기 방지)
  window.addEventListener('storage', (e) => {
    if (e.key !== STORAGE_KEY && e.key !== null) return;
    state = load();
    renderIngredients();
  });

  // ---------- 도구 ----------
  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  // toISOString()은 UTC 기준이라 한국 시간과 날짜가 어긋날 수 있어 직접 만든다
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function formatDate(str) {
    const date = parseDate(str);
    return `${date.getFullYear()}. ${date.getMonth() + 1}. ${date.getDate()}. (${WEEKDAYS[date.getDay()]})`;
  }

  function parseDate(str) {
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  // 오늘 기준 남은 날수 (오늘까지면 0, 어제까지였으면 -1)
  function daysLeft(expiry) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((parseDate(expiry) - today) / 86400000);
  }

  function expiryStatus(expiry) {
    const left = daysLeft(expiry);
    if (left < 0) return { cls: 'expired', label: `D+${-left} 기한 지남` };
    if (left === 0) return { cls: 'soon', label: '오늘까지' };
    if (left <= SOON_DAYS) return { cls: 'soon', label: `D-${left}` };
    return { cls: 'ok', label: `D-${left}` };
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function byExpiry(a, b) {
    if (a.expiry !== b.expiry) return a.expiry < b.expiry ? -1 : 1;
    return a.name.localeCompare(b.name, 'ko');
  }

  let toastTimer;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  // ---------- 재료 목록 그리기 ----------
  function renderBanner() {
    const expired = state.ingredients.filter((i) => daysLeft(i.expiry) < 0).length;
    $('#expiredBanner').hidden = expired === 0;
    $('#expiredCount').textContent = `기한 지난 재료 ${expired}개`;
  }

  function renderIngredients() {
    renderBanner();
    const wrap = $('#ingredientList');
    wrap.innerHTML = '';
    $('#ingredientCount').textContent = `총 ${state.ingredients.length}개`;

    if (!state.ingredients.length) {
      wrap.innerHTML = '<p class="empty">아직 등록된 재료가 없어요.<br>오른쪽 아래 <b>＋</b> 버튼을 눌러 첫 재료를 등록해 보세요.</p>';
      return;
    }

    CATEGORIES.forEach((cat) => {
      const items = state.ingredients
        .filter((i) => i.category === cat || (cat === '기타' && !CATEGORIES.includes(i.category)))
        .sort(byExpiry);
      if (!items.length) return;

      const sec = document.createElement('section');
      sec.className = 'cat';
      sec.innerHTML = `<h3>${esc(cat)} <span class="count">${items.length}</span></h3><ul></ul>`;
      const ul = sec.querySelector('ul');

      items.forEach((it) => {
        const status = expiryStatus(it.expiry);
        const delBtn = status.cls === 'expired'
          ? `<button class="btn-discard" type="button" data-del="${esc(it.id)}">🗑️ 폐기</button>`
          : `<button class="btn-ghost danger" type="button" data-del="${esc(it.id)}">다 씀</button>`;
        const li = document.createElement('li');
        li.className = `item ${status.cls}`;
        li.innerHTML = `
          <div class="item-main">
            <span class="item-name">${esc(it.name)}</span>
            <span class="badge ${status.cls}">${status.label}</span>
            <span class="item-date">소비기한 ${formatDate(it.expiry)}</span>
          </div>
          <div class="item-actions">
            <button class="btn-ghost" type="button" data-edit="${esc(it.id)}">수정</button>
            ${delBtn}
          </div>`;
        ul.appendChild(li);
      });

      wrap.appendChild(sec);
    });
  }

  // ---------- 재료 추가/수정 창 ----------
  const dialog = $('#ingredientDialog');
  let editingId = null;

  $('#ingCategory').innerHTML = CATEGORIES
    .map((c) => `<option value="${esc(c)}">${esc(c)}</option>`)
    .join('');

  function openIngredientDialog(id) {
    editingId = id || null;
    const item = editingId ? state.ingredients.find((i) => i.id === editingId) : null;

    $('#ingredientDialogTitle').textContent = item ? '재료 수정' : '재료 추가';
    $('#ingName').value = item ? item.name : '';
    $('#ingCategory').value = item && CATEGORIES.includes(item.category) ? item.category : CATEGORIES[0];
    $('#ingExpiry').value = item ? item.expiry : todayStr();
    $('#ingError').textContent = '';

    dialog.showModal();
    $('#ingName').focus();
  }

  $('#ingredientForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('#ingName').value.trim().replace(/\s+/g, ' ');
    const category = $('#ingCategory').value;
    const expiry = $('#ingExpiry').value;

    if (!name) { $('#ingError').textContent = '재료명을 입력해 주세요.'; $('#ingName').focus(); return; }
    if (!expiry) { $('#ingError').textContent = '소비기한 날짜를 선택해 주세요.'; $('#ingExpiry').focus(); return; }

    const left = daysLeft(expiry);
    if (left > CHECK_FUTURE_DAYS || left < -CHECK_PAST_DAYS) {
      const sure = await askConfirm(
        `소비기한이 ${formatDate(expiry)}(으)로 입력되었어요.\n연도나 날짜가 맞는지 확인해 주세요.`,
        '맞아요, 저장'
      );
      if (!sure) { $('#ingExpiry').focus(); return; }
    }

    // 수정 창을 연 사이 다른 탭에서 이 재료를 지운 경우
    if (editingId && !state.ingredients.some((i) => i.id === editingId)) {
      dialog.close();
      alert('다른 창에서 이미 삭제된 재료라 수정할 수 없어요.');
      return;
    }

    const saved = commit(() => {
      if (editingId) {
        Object.assign(state.ingredients.find((i) => i.id === editingId), { name, category, expiry });
      } else {
        state.ingredients.push({ id: newId(), name, category, expiry });
      }
    });

    if (saved) {
      dialog.close();
      renderIngredients();
      toast(editingId ? `‘${name}’ 수정했어요` : `‘${name}’ 등록했어요`);
    }
  });

  $('#ingCancel').addEventListener('click', () => dialog.close());
  $('#fab').addEventListener('click', () => openIngredientDialog());

  // ---------- 확인 창 ----------
  const confirmDialog = $('#confirmDialog');
  let confirmResolve = null;

  function askConfirm(message, okLabel) {
    $('#confirmMessage').textContent = message;
    $('#confirmOk').textContent = okLabel;
    confirmDialog.showModal();
    $('#confirmCancel').focus(); // 실수로 Enter를 눌러도 지워지지 않도록
    return new Promise((resolve) => { confirmResolve = resolve; });
  }

  function finishConfirm(result) {
    if (confirmDialog.open) confirmDialog.close();
    if (confirmResolve) {
      const resolve = confirmResolve;
      confirmResolve = null;
      resolve(result);
    }
  }

  $('#confirmOk').addEventListener('click', () => finishConfirm(true));
  $('#confirmCancel').addEventListener('click', () => finishConfirm(false));
  // Esc로 닫은 경우. close 이벤트는 늦게 도착하므로, 그사이 새 확인 창이 열렸다면 무시한다.
  confirmDialog.addEventListener('close', () => {
    if (!confirmDialog.open) finishConfirm(false);
  });

  // ---------- 목록의 수정/삭제 버튼 ----------
  $('#ingredientList').addEventListener('click', async (e) => {
    const editBtn = e.target.closest('[data-edit]');
    const delBtn = e.target.closest('[data-del]');

    if (editBtn) {
      openIngredientDialog(editBtn.dataset.edit);
    } else if (delBtn) {
      const item = state.ingredients.find((i) => i.id === delBtn.dataset.del);
      if (!item) return;
      const expired = daysLeft(item.expiry) < 0;
      const ok = await askConfirm(
        expired
          ? `‘${item.name}’ 재료를 실제로 폐기하셨나요?\n확인하면 목록에서 지워집니다.`
          : `‘${item.name}’ 재료를 다 쓰셨나요?\n확인하면 목록에서 지워집니다.`,
        expired ? '폐기' : '지우기'
      );
      if (!ok) return;
      const saved = commit(() => {
        state.ingredients = state.ingredients.filter((i) => i.id !== item.id);
      });
      if (saved) {
        renderIngredients();
        toast(expired ? `‘${item.name}’ 폐기했어요` : `‘${item.name}’ 지웠어요`);
      }
    }
  });

  // ---------- 자정이 지나면 색상 다시 계산 ----------
  let lastDay = todayStr();
  function refreshIfDayChanged() {
    const t = todayStr();
    if (t !== lastDay) {
      lastDay = t;
      renderIngredients();
    }
  }
  setInterval(refreshIfDayChanged, 60000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshIfDayChanged();
  });

  renderIngredients();
</script>
</body>
</html>
