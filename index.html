<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방과후 조리실 냉장고 요정</title>
<meta name="description" content="가정과 방과후 조리실습 도우미. 남은 재료의 소비기한을 챙기고, 지금 냉장고 재료로 만들 수 있는 실습 메뉴를 바로 찾아요.">
<meta name="theme-color" content="#2f7d5b">

<!-- 링크 미리보기(오픈그래프): 카카오톡·문자·SNS에 주소를 보낼 때 보이는 카드 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="방과후 조리실 냉장고 요정">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://godaeun1218-byte.github.io/cooking/">
<meta property="og:title" content="방과후 조리실 냉장고 요정">
<meta property="og:description" content="남은 재료의 소비기한을 챙기고, 지금 만들 수 있는 실습 메뉴를 바로 찾아요. 요리 자동 추천 · 소비기한 경고 · 기본 레시피 33개">
<meta property="og:image" content="https://godaeun1218-byte.github.io/cooking/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="방과후 조리실 냉장고 요정 — 추천 요리와 소비기한별 냉장고 재료 화면">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="방과후 조리실 냉장고 요정">
<meta name="twitter:description" content="남은 재료의 소비기한을 챙기고, 지금 만들 수 있는 실습 메뉴를 바로 찾아요.">
<meta name="twitter:image" content="https://godaeun1218-byte.github.io/cooking/og-image.png">

<!-- 브라우저 탭 아이콘 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧚</text></svg>">
<style>
  :root {
    --bg: #f5f7f3;
    --card: #ffffff;
    --text: #1f2a24;
    --muted: #6b756f;
    --line: #e2e6e0;
    --primary: #2f7d5b;
    --primary-dark: #236246;
    --primary-soft: #e6f2ec;
    --danger: #b3261e;
    --danger-bg: #fdecea;
    --ok: #3a9a5b;
    --ok-bg: #e5f4ea;
    --ok-text: #1f6b3a;
    --soon: #f2c200;
    --soon-bg: #fff8dc;
    --soon-text: #6b5000;
    --need-text: #8a5a00;
    --shadow: 0 2px 10px rgba(31, 42, 36, 0.08);
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    line-height: 1.5;
  }

  button, input, select { font: inherit; }

  /* ---------- 상단 ---------- */
  header {
    background: var(--primary);
    color: #fff;
    padding: 20px 24px;
  }
  header .inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 24px;
  }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-head {
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 10px;
    padding: 8px 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-head:hover { background: rgba(255, 255, 255, 0.26); }
  header h1 {
    margin: 0;
    font-size: 26px;
  }
  header p {
    margin: 4px 0 0;
    opacity: 0.85;
    font-size: 15px;
  }

  /* ---------- 본문 2단 배치 ---------- */
  .layout {
    display: grid;
    grid-template-columns: minmax(320px, 1fr) minmax(420px, 1.3fr);
    gap: 24px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 24px 120px;
    align-items: start;
  }

  .panel {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
  }
  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .panel h2 {
    margin: 0;
    font-size: 21px;
  }
  .panel-sub {
    color: var(--muted);
    font-size: 15px;
  }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 36px 12px;
    margin: 0;
  }

  /* ---------- 재료 목록 ---------- */
  .cat + .cat { margin-top: 18px; }
  .cat h3 {
    margin: 0 0 8px;
    font-size: 17px;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cat h3 .count {
    background: var(--primary-soft);
    color: var(--primary-dark);
    font-size: 13px;
    border-radius: 999px;
    padding: 1px 9px;
  }
  .cat ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .item + .item { margin-top: 6px; }
  .item-main {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 14px;
    min-width: 0;
  }
  .item-name {
    font-weight: 700;
    word-break: break-all;
  }
  .item-date {
    color: var(--muted);
    font-size: 15px;
  }
  .item-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  /* ---------- 소비기한 상태 색상 ---------- */
  .item.ok { border-left: 6px solid var(--ok); }
  .item.soon {
    border-left: 6px solid var(--soon);
    background: var(--soon-bg);
  }
  .item.expired {
    border: 2px solid var(--danger);
    border-left-width: 6px;
    background: var(--danger-bg);
  }
  .item.expired .item-name { color: var(--danger); }

  .badge {
    font-size: 14px;
    font-weight: 700;
    border-radius: 999px;
    padding: 1px 10px;
    white-space: nowrap;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok-text); }
  .badge.soon { background: var(--soon); color: var(--soon-text); }
  .badge.expired { background: var(--danger); color: #fff; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    color: var(--muted);
    font-size: 14px;
    margin: -4px 0 14px;
  }
  .legend span::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: 0;
  }
  .legend .ok::before { background: var(--ok); }
  .legend .soon::before { background: var(--soon); }
  .legend .expired::before { background: var(--danger); }

  /* ---------- 추천 요리 ---------- */
  .rec-group + .rec-group { margin-top: 22px; }
  .rec-group h3 {
    margin: 0 0 8px;
    font-size: 17px;
  }
  .rec-group h3.can { color: var(--ok-text); }
  .rec-group h3.need { color: var(--need-text); }
  .rec-none {
    color: var(--muted);
    margin: 0;
    font-size: 15px;
  }
  .rec-card {
    display: block;
    width: 100%;
    text-align: left;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }
  .rec-card + .rec-card { margin-top: 6px; }
  .rec-card:hover { border-color: var(--primary); background: #fafcf9; }
  .rec-card.can { border-left: 6px solid var(--ok); }
  .rec-card.need { border-left: 6px solid var(--soon); }
  .rec-name { display: block; font-weight: 700; font-size: 18px; }
  .rec-sub {
    display: block;
    color: var(--muted);
    font-size: 15px;
    margin-top: 2px;
  }
  .rec-sub.missing { color: var(--need-text); font-weight: 700; }
  .tag-builtin {
    display: inline-block;
    margin-left: 8px;
    padding: 0 8px;
    border-radius: 999px;
    background: #eef0ec;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    vertical-align: 2px;
  }
  .tag-builtin.big { font-size: 15px; padding: 2px 12px; vertical-align: 6px; margin-left: 12px; }
  .rec-more { margin-top: 8px; }
  .rec-more summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 15px;
    padding: 6px 2px;
  }
  .rec-more summary:hover { color: var(--primary-dark); }
  .rec-more[open] summary { margin-bottom: 6px; }
  .link-btn {
    display: block;
    margin: 18px auto 0;
    background: none;
    border: none;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    font-size: 14px;
  }
  .link-btn:hover { color: var(--primary-dark); }

  /* ---------- 상단 알림(백업 알림, 기한 경과 경고) ---------- */
  .banners {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 24px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .banners:not(:has(> :not([hidden]))) { display: none; }
  .banner[hidden],
  .info-banner[hidden] { display: none; }
  .info-banner {
    background: #e8f1fb;
    color: #1d3d5c;
    border-radius: var(--radius);
    padding: 10px 14px 10px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 16px;
    box-shadow: var(--shadow);
  }
  .info-actions { display: flex; gap: 6px; }
  .btn.btn-sm { padding: 6px 14px; font-size: 15px; }
  .banner {
    background: var(--danger);
    color: #fff;
    border-radius: var(--radius);
    padding: 14px 20px;
    font-weight: 700;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 12px;
    box-shadow: var(--shadow);
  }
  .banner-count {
    background: #fff;
    color: var(--danger);
    border-radius: 999px;
    padding: 1px 12px;
    font-size: 15px;
  }

  /* ---------- 버튼 ---------- */
  .btn {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    font-weight: 700;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-plain { background: #eef0ec; color: var(--text); }
  .btn-plain:hover { background: #e2e5df; }

  .btn-ghost {
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 12px;
    cursor: pointer;
    color: var(--text);
    font-size: 15px;
  }
  .btn-ghost:hover { background: #f1f3ef; }
  .btn-ghost.danger { color: var(--danger); }

  .btn-discard {
    background: var(--danger);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
  }
  .btn-discard:hover { background: #8f1d17; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #8f1d17; }

  .fab {
    position: fixed;
    right: 28px;
    bottom: 28px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 36px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(31, 42, 36, 0.3);
  }
  .fab:hover { background: var(--primary-dark); }

  .fab-menu {
    position: fixed;
    right: 28px;
    bottom: 104px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .fab-menu[hidden] { display: none; }
  .fab-menu button {
    background: #fff;
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 10px 20px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(31, 42, 36, 0.25);
  }
  .fab-menu button:hover { background: var(--primary-soft); }

  /* ---------- 입력 창 ---------- */
  dialog {
    border: none;
    border-radius: var(--radius);
    padding: 0;
    width: min(460px, calc(100vw - 32px));
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
  }
  dialog::backdrop { background: rgba(20, 30, 25, 0.45); }
  dialog form { padding: 22px 24px; }
  dialog h2 { margin: 0 0 16px; font-size: 21px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .field input,
  .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cfd5cd;
    border-radius: 10px;
    background: #fff;
    color: var(--text);
  }
  .field input:focus,
  .field select:focus {
    outline: 2px solid var(--primary);
    outline-offset: 1px;
  }
  .form-error {
    color: var(--danger);
    font-size: 15px;
    min-height: 1.5em;
    margin: 0 0 6px;
  }
  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* ---------- 레시피 입력 창 ---------- */
  dialog.wide { width: min(760px, calc(100vw - 32px)); }
  /* 내용은 스크롤, 아래쪽 안내·버튼은 항상 보이게 */
  dialog form.split {
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 40px);
    padding: 0;
  }
  .split-body {
    overflow: auto;
    padding: 22px 24px 8px;
  }
  .split-foot {
    border-top: 1px solid var(--line);
    padding: 10px 24px 18px;
    background: #fff;
  }
  .form-note {
    background: var(--soon-bg);
    color: var(--soon-text);
    border-radius: 8px;
    padding: 8px 12px;
    margin: -6px 0 14px;
    font-size: 15px;
  }
  .form-note[hidden] { display: none; }
  .split-foot .form-error { margin-bottom: 8px; min-height: 0; }
  .split-foot .form-error:empty { display: none; }
  .field small { font-weight: 400; color: var(--muted); font-size: 14px; }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row-line {
    display: grid;
    grid-template-columns: 1fr 170px 36px;
    gap: 6px;
    align-items: center;
  }
  .row-line.step { grid-template-columns: 30px 1fr 36px; }
  .row-line input,
  .row-line textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #cfd5cd;
    border-radius: 8px;
    font: inherit;
    color: var(--text);
  }
  .row-line textarea { resize: none; min-height: 44px; overflow: hidden; }
  .row-line input:focus,
  .row-line textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .step-no { font-weight: 700; color: var(--primary-dark); text-align: center; }
  .row-del {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    border-radius: 8px;
  }
  .row-del:hover { background: #f1f3ef; color: var(--danger); }
  .add-row {
    margin-top: 6px;
    background: none;
    border: 1px dashed #b9c2b6;
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    color: var(--primary-dark);
    font: inherit;
    font-size: 15px;
  }
  .add-row:hover { background: var(--primary-soft); }

  /* ---------- 레시피 크게 보기 ---------- */
  dialog.view { width: min(1000px, calc(100vw - 32px)); }
  .view-body {
    padding: 28px 32px;
    font-size: 21px;
    max-height: calc(100vh - 40px);
    overflow: auto;
  }
  .view-body h2 { font-size: 34px; margin: 0 0 4px; }
  .view-status { font-weight: 700; margin: 0 0 20px; }
  .view-status.can { color: var(--ok-text); }
  .view-status.need { color: var(--need-text); }
  .view-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
  }
  .view-body h3 {
    font-size: 22px;
    margin: 0 0 8px;
    color: var(--primary-dark);
    border-bottom: 2px solid var(--primary-soft);
    padding-bottom: 4px;
  }
  .view-body ul { margin: 0; padding: 0; list-style: none; }
  .view-body ul li { padding: 4px 0; }
  .view-body .amt { color: var(--muted); margin-left: 8px; }
  .view-body .miss { color: var(--need-text); font-weight: 700; }
  .view-steps { margin-top: 26px; }
  .view-steps ol { margin: 0; padding-left: 1.5em; }
  .view-steps ol li { padding: 6px 0; white-space: pre-line; }
  .view-empty { color: var(--muted); margin: 0; }
  .view-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 28px;
    font-size: 17px;
  }

  .confirm-body { padding: 22px 24px; }
  .confirm-body p {
    margin: 0 0 20px;
    white-space: pre-line;
    font-size: 18px;
  }

  /* ---------- 알림 ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: #2b332e;
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- 좁은 화면 ---------- */
  @media (max-width: 900px) {
    .layout {
      grid-template-columns: 1fr;
      padding: 16px 16px 110px;
    }
    header { padding: 16px; }
    .banners { padding: 16px 16px 0; }
    .fab { right: 16px; bottom: 16px; }
    .fab-menu { right: 16px; bottom: 92px; }
    .row-line { grid-template-columns: 1fr 100px 32px; }
    .view-body { padding: 20px; }
    .view-cols { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="inner">
    <div>
      <h1>🧚 방과후 조리실 냉장고 요정</h1>
      <p>냉장고 재료와 실습 레시피를 한눈에 관리해요. 모든 정보는 이 컴퓨터의 브라우저에만 저장됩니다.</p>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-head" id="exportBtn" title="재료와 레시피 전체를 파일로 내려받아요">💾 백업 저장</button>
      <button type="button" class="btn-head" id="importBtn" title="백업 파일에서 재료와 레시피를 되살려요">📂 백업 불러오기</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </div>
</header>

<div class="banners">
  <!-- 백업한 지 오래되었을 때 알림 -->
  <div class="info-banner" id="backupReminder" hidden>
    <span id="backupReminderText"></span>
    <span class="info-actions">
      <button type="button" class="btn btn-primary btn-sm" id="backupNowBtn">지금 백업하기</button>
      <button type="button" class="btn btn-plain btn-sm" id="backupSnoozeBtn">오늘은 그만 보기</button>
    </span>
  </div>
  <!-- 기한 지난 재료가 있을 때만 보이는 경고 -->
  <div class="banner" id="expiredBanner" role="alert" hidden>
    <span>⚠️ 소비기한이 지난 재료는 위생 안전을 위해 확인 후 즉시 폐기하세요.</span>
    <span class="banner-count" id="expiredCount"></span>
  </div>
</div>

<main class="layout">
  <!-- 왼쪽: 추천 요리 -->
  <section class="panel" id="recommendPanel">
    <div class="panel-head">
      <h2>🍳 추천 요리</h2>
      <span class="panel-sub" id="recipeCount"></span>
    </div>
    <div id="recommendList"></div>
  </section>

  <!-- 오른쪽: 냉장고 재료 -->
  <section class="panel" id="ingredientPanel">

  }

  let state = load();

  // 같은 앱을 다른 탭에서 바꾸면 이 탭도 최신 데이터로 다시 읽는다 (덮어쓰기 방지)
  window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_KEY || e.key === null) {
      state = load();
      renderAll();
    } else if (e.key === LAST_BACKUP_KEY || e.key === SNOOZE_KEY) {
      renderBackupReminder();
    }
  });

  // ---------- 도구 ----------
  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  // toISOString()은 UTC 기준이라 한국 시간과 날짜가 어긋날 수 있어 직접 만든다
  function localDateStr(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function todayStr() {
    return localDateStr(new Date());
  }

  function formatDate(str) {
    const date = parseDate(str);
    return `${date.getFullYear()}. ${date.getMonth() + 1}. ${date.getDate()}. (${WEEKDAYS[date.getDay()]})`;
  }

  function parseDate(str) {
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  // 오늘 기준 남은 날수 (오늘까지면 0, 어제까지였으면 -1)
  function daysLeft(expiry) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((parseDate(expiry) - today) / 86400000);
  }

  function expiryStatus(expiry) {
    const left = daysLeft(expiry);
    if (left < 0) return { cls: 'expired', label: `D+${-left} 기한 지남` };
    if (left === 0) return { cls: 'soon', label: '오늘까지' };
    if (left <= SOON_DAYS) return { cls: 'soon', label: `D-${left}` };
    return { cls: 'ok', label: `D-${left}` };
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ---------- 데이터 검사 (저장된 데이터 읽기, 백업 불러오기에 함께 쓴다) ----------
  function isValidDateStr(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const d = parseDate(s);
    return localDateStr(d) === s; // 2026-02-31 같은 없는 날짜를 걸러낸다
  }

  function textField(v, max) {
    return typeof v === 'string' ? cleanText(v).slice(0, max) : '';
  }

  // 올바른 항목만 남기고, 빠진 개수를 함께 돌려준다
  function sanitizeData(data) {
    const out = { ingredients: [], recipes: [], hiddenBuiltins: [] };
    let skipped = 0;
    const ids = new Set();
    const uniqueId = (id) => {
      let v = typeof id === 'string' && id && !ids.has(id) ? id : newId();
      while (ids.has(v)) v = newId();
      ids.add(v);
      return v;
    };
    const pairs = (arr) => (Array.isArray(arr) ? arr : [])
      .filter((p) => p && typeof p === 'object')
      .map((p) => ({ name: textField(p.name, 30), amount: textField(p.amount, 20) }))
      .filter((p) => p.name);

    const src = data && typeof data === 'object' ? data : {};
    (Array.isArray(src.ingredients) ? src.ingredients : []).forEach((i) => {
      const name = i && typeof i === 'object' ? textField(i.name, 30) : '';
      if (!name || !isValidDateStr(i.expiry)) { skipped++; return; }
      out.ingredients.push({
        id: uniqueId(i.id),
        name,
        category: CATEGORIES.includes(i.category) ? i.category : '기타',
        expiry: i.expiry
      });
    });
    (Array.isArray(src.recipes) ? src.recipes : []).forEach((r) => {
      const name = r && typeof r === 'object' ? textField(r.name, 40) : '';
      const mains = name ? pairs(r.mains) : [];
      if (!name || !mains.length) { skipped++; return; }
      const recipe = {
        id: uniqueId(r.id),
        name,
        mains,
        seasonings: pairs(r.seasonings),
        steps: (Array.isArray(r.steps) ? r.steps : [])
          .filter((s) => typeof s === 'string' && s.trim())
          .map((s) => s.trim().slice(0, 300))
      };
      if (typeof r.fromBuiltin === 'string' && r.fromBuiltin) recipe.fromBuiltin = r.fromBuiltin;
      out.recipes.push(recipe);
    });
    // 숨긴 기본 레시피 목록 (예전 데이터에는 없을 수 있다)
    out.hiddenBuiltins = [...new Set((Array.isArray(src.hiddenBuiltins) ? src.hiddenBuiltins : [])
      .filter((id) => typeof id === 'string' && id))];
    return { data: out, skipped };
  }

  function byExpiry(a, b) {
    if (a.expiry !== b.expiry) return a.expiry < b.expiry ? -1 : 1;
    return a.name.localeCompare(b.name, 'ko');
  }

  let toastTimer;
  function toast(msg, ms = 1800) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), ms);
  }

  // ---------- 재료 목록 그리기 ----------
  function renderBanner() {
    const expired = state.ingredients.filter((i) => daysLeft(i.expiry) < 0).length;
    $('#expiredBanner').hidden = expired === 0;
    $('#expiredCount').textContent = `기한 지난 재료 ${expired}개`;
  }

  function renderIngredients() {
    renderBanner();
    const wrap = $('#ingredientList');
    wrap.innerHTML = '';
    $('#ingredientCount').textContent = `총 ${state.ingredients.length}개`;

    if (!state.ingredients.length) {
      wrap.innerHTML = '<p class="empty">아직 등록된 재료가 없어요.<br>오른쪽 아래 <b>＋</b> 버튼 → <b>재료 추가</b>로 첫 재료를 등록해 보세요.</p>';
      return;
    }

    CATEGORIES.forEach((cat) => {
      const items = state.ingredients
        .filter((i) => i.category === cat || (cat === '기타' && !CATEGORIES.includes(i.category)))
        .sort(byExpiry);
      if (!items.length) return;

      const sec = document.createElement('section');
      sec.className = 'cat';
      sec.innerHTML = `<h3>${esc(cat)} <span class="count">${items.length}</span></h3><ul></ul>`;
      const ul = sec.querySelector('ul');

      items.forEach((it) => {
        const status = expiryStatus(it.expiry);
        const delBtn = status.cls === 'expired'
          ? `<button class="btn-discard" type="button" data-del="${esc(it.id)}">🗑️ 폐기</button>`
          : `<button class="btn-ghost danger" type="button" data-del="${esc(it.id)}">다 씀</button>`;
        const li = document.createElement('li');
        li.className = `item ${status.cls}`;
        li.innerHTML = `
          <div class="item-main">
            <span class="item-name">${esc(it.name)}</span>
            <span class="badge ${status.cls}">${status.label}</span>
            <span class="item-date">소비기한 ${formatDate(it.expiry)}</span>
          </div>
          <div class="item-actions">
            <button class="btn-ghost" type="button" data-edit="${esc(it.id)}">수정</button>
            ${delBtn}
          </div>`;
        ul.appendChild(li);
      });

      wrap.appendChild(sec);
    });
  }

  // ---------- 레시피와 냉장고 비교 ----------
  // 재료 이름 비교 규칙: 띄어쓰기와 대소문자는 무시한다 ("방울 토마토" = "방울토마토")
  function norm(s) {
    return String(s).replace(/\s+/g, '').toLowerCase();
  }

  // 같은 재료의 다른 이름까지 하나로 맞춘 비교용 이름 ("계란" → "달걀", "햇반" → "밥")
  function canon(s) {
    const n = norm(s);
    return SYNONYMS[n] ? norm(SYNONYMS[n]) : n;
  }

  // 기한이 남은 재료(비교에 쓰임)와 기한 지난 재료(안내용)의 이름 모음
  function fridgeSets() {
    const fresh = new Set();
    const expired = new Set();
    state.ingredients.forEach((i) => (daysLeft(i.expiry) < 0 ? expired : fresh).add(canon(i.name)));
    return { fresh, expired };
  }

  function recipeMains(r) {
    return Array.isArray(r.mains) ? r.mains : [];
  }

  function missingOf(r, sets) {
    return recipeMains(r).filter((m) => !sets.fresh.has(canon(m.name)));
  }

  // 냉장고에 있지만 기한이 지나 쓸 수 없는 재료는 그렇다고 알려준다
  function missingLabel(m, sets) {
    return sets.expired.has(canon(m.name)) ? `${m.name}(기한 지남)` : m.name;
  }

  // ---------- 내 레시피 + 기본 레시피 ----------
  // 숨긴 기본 레시피와, 고쳐서 내 레시피로 만든 기본 레시피는 빼고 보여준다
  function visibleBuiltins() {
    const hidden = new Set(state.hiddenBuiltins);
    const copied = new Set(state.recipes.map((r) => r.fromBuiltin).filter(Boolean));
    return BUILTIN_RECIPES.filter((b) => !hidden.has(b.id) && !copied.has(b.id));
  }

  function allRecipes() {
    return [...state.recipes, ...visibleBuiltins()];
  }

  function findRecipe(id) {
    return state.recipes.find((r) => r.id === id) || BUILTIN_RECIPES.find((b) => b.id === id) || null;
  }

  // 내 레시피를 먼저, 그다음 이름순
  function byRecipeOrder(a, b) {
    return (a.r.builtin ? 1 : 0) - (b.r.builtin ? 1 : 0) || a.r.name.localeCompare(b.r.name, 'ko');
  }

  // 재료가 이만큼 이상 부족한 기본 레시피는 접어 둔다 (내 레시피는 항상 보인다)
  const FOLD_MISSING = 3;

  function renderRecipes() {
    const wrap = $('#recommendList');
    const recipes = allRecipes();
    const builtinCount = recipes.filter((r) => r.builtin).length;
    $('#recipeCount').textContent = builtinCount
      ? `레시피 ${recipes.length}개 (기본 ${builtinCount}개)`
      : `레시피 ${recipes.length}개`;

    const hiddenCount = state.hiddenBuiltins.filter((id) => BUILTIN_RECIPES.some((b) => b.id === id)).length;
    const restoreHtml = hiddenCount
      ? `<button type="button" class="link-btn" id="restoreBuiltins">숨긴 기본 레시피 ${hiddenCount}개 다시 보이기</button>`
      : '';

    if (!recipes.length) {
      wrap.innerHTML = '<p class="empty">아직 등록된 레시피가 없어요.<br>오른쪽 아래 <b>＋</b> 버튼 → <b>레시피 추가</b>로 첫 레시피를 등록해 보세요.</p>' + restoreHtml;
      return;
    }

    // 다시 그려도 "더 보기"를 펼쳐 둔 상태는 유지한다
    const moreWasOpen = !!(wrap.querySelector('.rec-more') || {}).open;

    const sets = fridgeSets();
    const list = recipes.map((r) => ({ r, missing: missingOf(r, sets) }));
    const can = list.filter((x) => !x.missing.length).sort(byRecipeOrder);
    const need = list.filter((x) => x.missing.length)
      .sort((a, b) => a.missing.length - b.missing.length || byRecipeOrder(a, b));
    const needShown = need.filter((x) => !x.r.builtin || x.missing.length < FOLD_MISSING);
    const needFolded = need.filter((x) => x.r.builtin && x.missing.length >= FOLD_MISSING);

    const card = (x, cls) => {
      const sub = cls === 'can'
        ? `<span class="rec-sub">주재료: ${recipeMains(x.r).map((m) => esc(m.name)).join(', ')}</span>`
        : `<span class="rec-sub missing">🛒 부족한 재료: ${x.missing.map((m) => esc(missingLabel(m, sets))).join(', ')}</span>`;
      const tag = x.r.builtin ? '<span class="tag-builtin">기본</span>' : '';
      return `<button type="button" class="rec-card ${cls}" data-recipe="${esc(x.r.id)}">
          <span class="rec-name">${esc(x.r.name)}${tag}</span>${sub}
        </button>`;
    };

    let html = `<section class="rec-group"><h3 class="can">✅ 지금 바로 만들 수 있어요 (${can.length})</h3>`;
    html += can.length ? can.map((x) => card(x, 'can')).join('') : '<p class="rec-none">아직 없어요. 아래 요리의 부족한 재료를 확인해 보세요.</p>';
    html += '</section>';
    if (need.length) {
      html += `<section class="rec-group"><h3 class="need">🛒 재료가 더 필요해요 (${need.length})</h3>`;
      html += needShown.map((x) => card(x, 'need')).join('');
      if (needFolded.length) {
        html += `<details class="rec-more"${moreWasOpen ? ' open' : ''}>
            <summary>재료가 ${FOLD_MISSING}개 이상 더 필요한 기본 레시피 ${needFolded.length}개 더 보기</summary>
            ${needFolded.map((x) => card(x, 'need')).join('')}
          </details>`;
      }
      html += '</section>';
    }
    wrap.innerHTML = html + restoreHtml;
  }

  // 자동완성 목록: 주재료는 냉장고 재료와 모든 레시피의 주재료 이름, 양념은 흔한 양념 + 쓴 적 있는 양념
  // (재료 입력 칸에도 같은 목록을 붙여, 냉장고 재료 이름이 레시피와 맞춰지게 한다)
  function renderDatalists() {
    const uniq = (arr) => [...new Map(arr.filter(Boolean).map((n) => [norm(n), n])).values()]
      .sort((a, b) => a.localeCompare(b, 'ko'));
    const recipes = [...state.recipes, ...BUILTIN_RECIPES];
    const mains = uniq([
      ...state.ingredients.map((i) => i.name),
      ...recipes.flatMap((r) => recipeMains(r).map((m) => m.name))
    ]);
    const seasonings = uniq([
      ...COMMON_SEASONINGS,
      ...recipes.flatMap((r) => (Array.isArray(r.seasonings) ? r.seasonings : []).map((s) => s.name))
    ]);
    $('#ingredientNames').innerHTML = mains.map((n) => `<option value="${esc(n)}"></option>`).join('');
    $('#seasoningNames').innerHTML = seasonings.map((n) => `<option value="${esc(n)}"></option>`).join('');
  }

  function renderAll() {
    renderIngredients();
    renderRecipes();
    renderDatalists();
    refreshRecipeView();
    renderBackupReminder();
  }

  // ---------- 재료 추가/수정 창 ----------
  const dialog = $('#ingredientDialog');
  let editingId = null;

  $('#ingCategory').innerHTML = CATEGORIES
    .map((c) => `<option value="${esc(c)}">${esc(c)}</option>`)
    .join('');

  function openIngredientDialog(id) {
    editingId = id || null;
    const item = editingId ? state.ingredients.find((i) => i.id === editingId) : null;

    $('#ingredientDialogTitle').textContent = item ? '재료 수정' : '재료 추가';
    $('#ingName').value = item ? item.name : '';
    $('#ingCategory').value = item && CATEGORIES.includes(item.category) ? item.category : CATEGORIES[0];
    $('#ingExpiry').value = item ? item.expiry : todayStr();
    $('#ingError').textContent = '';

    dialog.showModal();
    $('#ingName').focus();
  }

  $('#ingredientForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('#ingName').value.trim().replace(/\s+/g, ' ');
    const category = $('#ingCategory').value;
    const expiry = $('#ingExpiry').value;

    if (!name) { $('#ingError').textContent = '재료명을 입력해 주세요.'; $('#ingName').focus(); return; }
    if (!expiry) { $('#ingError').textContent = '소비기한 날짜를 선택해 주세요.'; $('#ingExpiry').focus(); return; }

    const left = daysLeft(expiry);
    if (left > CHECK_FUTURE_DAYS || left < -CHECK_PAST_DAYS) {
      const sure = await askConfirm(
        `소비기한이 ${formatDate(expiry)}(으)로 입력되었어요.\n연도나 날짜가 맞는지 확인해 주세요.`,
        '맞아요, 저장'
      );
      if (!sure) { $('#ingExpiry').focus(); return; }
    }

    // 수정 창을 연 사이 다른 탭에서 이 재료를 지운 경우
    if (editingId && !state.ingredients.some((i) => i.id === editingId)) {
      dialog.close();
      alert('다른 창에서 이미 삭제된 재료라 수정할 수 없어요.');
      return;
    }

    const saved = commit(() => {
      if (editingId) {
        Object.assign(state.ingredients.find((i) => i.id === editingId), { name, category, expiry });
      } else {
        state.ingredients.push({ id: newId(), name, category, expiry });
      }
    });

    if (saved) {
      dialog.close();
      renderAll();
      toast(editingId ? `‘${name}’ 수정했어요` : `‘${name}’ 등록했어요`);
    }
  });

  $('#ingCancel').addEventListener('click', () => dialog.close());

  // ---------- ＋ 버튼 메뉴 ----------
  const fabMenu = $('#fabMenu');

  function setFabMenu(open) {
    fabMenu.hidden = !open;
    $('#fab').setAttribute('aria-expanded', String(open));
  }

  $('#fab').addEventListener('click', () => setFabMenu(fabMenu.hidden));
  $('#addIngredientBtn').addEventListener('click', () => { setFabMenu(false); openIngredientDialog(); });
  $('#addRecipeBtn').addEventListener('click', () => { setFabMenu(false); openRecipeDialog(); });
  document.addEventListener('click', (e) => {
    if (!fabMenu.hidden && !e.target.closest('#fabMenu, #fab')) setFabMenu(false);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !fabMenu.hidden) setFabMenu(false);
  });

  // ---------- 레시피 추가/수정 창 ----------
  const recipeDialog = $('#recipeDialog');
  let editingRecipeId = null;

  const ROW_HOLDERS = { main: '#mainRows', season: '#seasonRows', step: '#stepRows' };

  function cleanText(s) {
    return String(s).trim().replace(/\s+/g, ' ');
  }

  function addRow(kind, first = '', second = '') {
    const div = document.createElement('div');
    if (kind === 'step') {
      div.className = 'row-line step';
      div.innerHTML = `<span class="step-no"></span>
        <textarea rows="1" maxlength="300" placeholder="예: 김치를 잘게 썬다"></textarea>
        <button type="button" class="row-del" aria-label="이 단계 지우기" title="이 단계 지우기">✕</button>`;
      const ta = div.querySelector('textarea');
      ta.value = first;
      ta.addEventListener('input', () => autosize(ta));
    } else {
      const isMain = kind === 'main';
      div.className = 'row-line';
      div.innerHTML = `<input type="text" maxlength="30" autocomplete="off"
          list="${isMain ? 'ingredientNames' : 'seasoningNames'}"
          placeholder="${isMain ? '재료명 (예: 김치)' : '양념명 (예: 식용유)'}" aria-label="${isMain ? '주재료 이름' : '양념 이름'}">
        <input type="text" maxlength="20" placeholder="분량 (예: 1컵)" aria-label="분량">
        <button type="button" class="row-del" aria-label="이 줄 지우기" title="이 줄 지우기">✕</button>`;
      const [nameInput, amountInput] = div.querySelectorAll('input');
      nameInput.value = first;
      amountInput.value = second;
    }
    $(ROW_HOLDERS[kind]).appendChild(div);
    renumberSteps();
    return div;
  }

  // 조리 순서 칸이 내용 길이에 맞춰 늘어나게 한다
  function autosize(ta) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 2 + 'px';
  }

  // 입력 창의 내용을 그대로 읽는다 (완전히 빈 줄은 뺀다)
  function readForm() {
    const pairs = (kind) => [...$(ROW_HOLDERS[kind]).querySelectorAll('.row-line')]
      .map((row) => [...row.querySelectorAll('input')].map((i) => i.value))
      .filter(([n, a]) => n.trim() || a.trim());
    return {
      name: $('#recName').value,
      mains: pairs('main'),
      seasonings: pairs('season'),
      steps: [...$('#stepRows').querySelectorAll('textarea')].map((t) => t.value).filter((v) => v.trim())
    };
  }

  // 입력 창을 주어진 내용으로 채우고, 빈 줄을 미리 몇 개 둔다
  function fillForm(d) {
    $('#recName').value = d.name;
    Object.values(ROW_HOLDERS).forEach((sel) => { $(sel).innerHTML = ''; });
    d.mains.forEach(([n, a]) => addRow('main', n, a));
    d.seasonings.forEach(([n, a]) => addRow('season', n, a));
    d.steps.forEach((s) => addRow('step', s));
    for (let i = d.mains.length; i < 3; i++) addRow('main');
    for (let i = d.seasonings.length; i < 2; i++) addRow('season');
    for (let i = d.steps.length; i < 3; i++) addRow('step');
  }

  // 창을 열 때와 비교해 바뀐 게 있는지 판단하는 데 쓴다
  function recipeDraft() {
    return JSON.stringify(readForm());
  }

  // ---------- 작성 중인 레시피 임시 저장 ----------
  // 어떤 이유로 창이 저장 없이 닫혀도(실수로 새로고침 포함) 다음에 열 때 이어 쓸 수 있게 한다
  const DRAFT_KEY = 'fridgeFairy.recipeDraft';

  function loadDraft() {
    try { return JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch (e) { return null; }
  }

  // 지금 열린 창(새 레시피 또는 수정 중인 그 레시피)의 임시 저장만 지운다
  function clearDraft() {
    const draft = loadDraft();
    if (!draft || draft.target !== editingRecipeId) return;
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* 무시 */ }
  }

  function syncDraft() {
    if (!recipeDialog.open) return;
    if (recipeDraft() === recipeSnapshot) { clearDraft(); return; }
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify({ target: editingRecipeId, data: readForm() }));
    } catch (e) { /* 임시 저장은 실패해도 괜찮다 */ }
  }

  function renumberSteps() {
    $('#stepRows').querySelectorAll('.step-no').forEach((el, i) => { el.textContent = `${i + 1}.`; });
  }

  // 이름·분량 줄을 읽는다. 둘 다 빈 줄은 건너뛰고, 분량만 있는 줄은 오류로 알린다.
  function readPairs(kind) {
    const list = [];
    let orphan = false;
    $(ROW_HOLDERS[kind]).querySelectorAll('.row-line').forEach((row) => {
      const [nameInput, amountInput] = row.querySelectorAll('input');
      const name = cleanText(nameInput.value);
      const amount = cleanText(amountInput.value);
      if (name) list.push({ name, amount });
      else if (amount) orphan = true;
    });
    return { list, orphan };
  }

  function openRecipeDialog(id) {
    editingRecipeId = id || null;
    const r = editingRecipeId ? findRecipe(editingRecipeId) : null;

    $('#recipeDialogTitle').textContent = !r ? '레시피 추가'
      : r.builtin ? '기본 레시피를 내 레시피로 고치기' : '레시피 수정';
    $('#recError').textContent = '';

    fillForm({
      name: r ? r.name : '',
      mains: r ? recipeMains(r).map((m) => [m.name, m.amount]) : [],
      seasonings: r && Array.isArray(r.seasonings) ? r.seasonings.map((s) => [s.name, s.amount]) : [],
      steps: r && Array.isArray(r.steps) ? r.steps : []
    });
    recipeSnapshot = recipeDraft();

    // 같은 레시피(또는 새 레시피)를 쓰다가 저장 없이 닫힌 적이 있으면 이어서 쓰게 불러온다
    const draft = loadDraft();
    let restored = false;
    if (draft && draft.target === editingRecipeId && draft.data && JSON.stringify(draft.data) !== recipeSnapshot) {
      try {
        fillForm(draft.data);
        restored = true;
      } catch (e) {
        clearDraft();
        fillForm(JSON.parse(recipeSnapshot));
      }
    }

    $('#recNote').hidden = !restored;
    recipeDialog.showModal();
    $('#stepRows').querySelectorAll('textarea').forEach(autosize);
    $('#recipeForm .split-body').scrollTop = 0;
    $('#recName').focus();
  }

  // ---------- 작성 중인 레시피를 실수로 닫지 않게 ----------
  let recipeSnapshot = '';

  // 저장했거나 버리기로 한 경우: 임시 저장도 지우고 닫는다
  function finishRecipeDialog() {
    clearDraft();
    recipeDialog.close();
  }

  async function requestCloseRecipe() {
    if (confirmDialog.open) return;
    if (recipeDraft() !== recipeSnapshot) {
      const ok = await askConfirm('작성 중인 내용이 아직 저장되지 않았어요.\n저장하지 않고 닫을까요?', '저장 안 하고 닫기');
      if (!ok) return;
    }
    finishRecipeDialog();
  }

  $('#recCancel').addEventListener('click', requestCloseRecipe);
  // Esc: 바뀐 내용이 있으면 바로 닫지 않고 물어본다.
  recipeDialog.addEventListener('cancel', (e) => {
    if (recipeDraft() === recipeSnapshot) return;
    if (!e.cancelable) {
      // Esc를 연달아 누르면 브라우저가 막을 수 없게 창을 닫는다. 내용은 임시 저장해 두고 알려준다.
      syncDraft();
      setTimeout(() => toast(editingRecipeId
        ? '고치던 내용은 임시 저장했어요. 이 레시피의 ‘수정’을 다시 누르면 이어서 쓸 수 있어요.'
        : '쓰던 내용은 임시 저장했어요. ‘레시피 추가’를 다시 누르면 이어서 쓸 수 있어요.', 4500), 0);
      return;
    }
    e.preventDefault();
    requestCloseRecipe();
  });
  $('#recipeForm').addEventListener('input', syncDraft);

  $('#recipeForm').addEventListener('click', (e) => {
    const add = e.target.closest('[data-add]');
    const del = e.target.closest('.row-del');
    if (add) {
      const row = addRow(add.dataset.add);
      row.querySelector('input, textarea').focus();
    } else if (del) {
      const row = del.closest('.row-line');
      const holder = row.parentElement;
      row.remove();
      // 줄이 하나도 없으면 빈 줄 하나를 남겨 둔다
      if (!holder.children.length) {
        addRow(Object.keys(ROW_HOLDERS).find((k) => $(ROW_HOLDERS[k]) === holder));
      }
      renumberSteps();
      syncDraft();
    }
  });

  // 줄 입력 중 Enter를 눌러도 레시피가 덜 쓴 채로 저장되지 않게 한다
  $('#recipeForm').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.preventDefault();
  });

  $('#recipeForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const err = (msg, el) => { $('#recError').textContent = msg; if (el) el.focus(); };

    const name = cleanText($('#recName').value);
    if (!name) return err('요리명을 입력해 주세요.', $('#recName'));

    const mains = readPairs('main');
    const seasonings = readPairs('season');
    if (mains.orphan || seasonings.orphan) {
      return err('분량만 적히고 이름이 빈 줄이 있어요. 이름을 적거나 ✕로 줄을 지워 주세요.');
    }
    if (!mains.list.length) {
      return err('주재료를 하나 이상 적어 주세요.', $('#mainRows input'));
    }
    const steps = [...$('#stepRows').querySelectorAll('textarea')]
      .map((t) => t.value.trim())
      .filter(Boolean);

    // 수정 창을 연 사이 다른 탭에서 이 레시피를 지운 경우
    const target = editingRecipeId ? findRecipe(editingRecipeId) : null;
    if (editingRecipeId && !target) {
      finishRecipeDialog();
      alert('다른 창에서 이미 삭제된 레시피라 수정할 수 없어요.');
      return;
    }

    const data = { name, mains: mains.list, seasonings: seasonings.list, steps };
    const saved = commit(() => {
      if (target && target.builtin) {
        // 기본 레시피는 그대로 두고, 고친 내용을 내 레시피로 저장한다 (기본 레시피는 목록에서 빠진다)
        state.recipes.push({ id: newId(), fromBuiltin: target.id, ...data });
      } else if (target) {
        Object.assign(state.recipes.find((r) => r.id === target.id), data);
      } else {
        state.recipes.push({ id: newId(), ...data });
      }
    });

    if (saved) {
      finishRecipeDialog();
      renderAll();
      toast(!target ? `‘${name}’ 레시피를 등록했어요`
        : target.builtin ? `‘${name}’을(를) 내 레시피로 저장했어요` : `‘${name}’ 레시피를 수정했어요`);
    }
  });

  // ---------- 레시피 크게 보기 ----------
  const viewDialog = $('#viewDialog');
  let viewingId = null;

  function fillRecipeView(r) {
    const sets = fridgeSets();
    const missing = missingOf(r, sets);
    const missingKeys = new Set(missing.map((m) => canon(m.name)));
    const amt = (a) => (a ? `<span class="amt">${esc(a)}</span>` : '');

    const mainsHtml = recipeMains(r).map((m) => (missingKeys.has(canon(m.name))
      ? `<li><span class="miss">🛒 ${esc(missingLabel(m, sets))}</span>${amt(m.amount)}</li>`
      : `<li>✅ ${esc(m.name)}${amt(m.amount)}</li>`)).join('');
    const seasonings = Array.isArray(r.seasonings) ? r.seasonings : [];
    const seasonHtml = seasonings.length
      ? `<ul>${seasonings.map((s) => `<li>• ${esc(s.name)}${amt(s.amount)}</li>`).join('')}</ul>`
      : '<p class="view-empty">없음</p>';
    const steps = Array.isArray(r.steps) ? r.steps : [];
    const stepsHtml = steps.length
      ? `<ol>${steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>`
      : '<p class="view-empty">조리 순서가 아직 없어요. ‘수정’에서 추가할 수 있어요.</p>';
    const status = missing.length
      ? `<p class="view-status need">🛒 부족한 재료: ${missing.map((m) => esc(missingLabel(m, sets))).join(', ')}</p>`
      : '<p class="view-status can">✅ 지금 냉장고 재료로 만들 수 있어요</p>';

    const actions = r.builtin
      ? `<button class="btn btn-plain" type="button" data-view="edit" title="고친 내용은 내 레시피로 저장돼요">내 레시피로 고치기</button>
         <button class="btn btn-plain" type="button" data-view="hide">추천에서 숨기기</button>`
      : `<button class="btn btn-plain" type="button" data-view="edit">수정</button>
         <button class="btn btn-danger" type="button" data-view="delete">레시피 삭제</button>`;

    $('#viewBody').innerHTML = `
      <h2>${esc(r.name)}${r.builtin ? '<span class="tag-builtin big">기본 레시피</span>' : ''}</h2>
      ${status}
      <div class="view-cols">
        <section><h3>주재료</h3><ul>${mainsHtml}</ul></section>
        <section><h3>기본 양념</h3>${seasonHtml}</section>
      </div>
      <section class="view-steps"><h3>조리 순서</h3>${stepsHtml}</section>
      <div class="view-actions">
        ${actions}
        <button class="btn btn-primary" type="button" data-view="close">닫기</button>
      </div>`;
  }

  // 지금 추천 목록에 보이는 레시피만 연다 (숨긴 기본 레시피는 제외)
  function findVisibleRecipe(id) {
    return allRecipes().find((x) => x.id === id) || null;
  }

  function openRecipeView(id) {
    const r = findVisibleRecipe(id);
    if (!r) return;
    viewingId = id;
    fillRecipeView(r);
    viewDialog.showModal();
    viewDialog.querySelector('[data-view="close"]').focus();
    $('#viewBody').scrollTop = 0;
  }

  // 보고 있는 사이 재료나 레시피가 바뀌면 내용을 새로 그린다
  function refreshRecipeView() {
    if (!viewDialog.open) return;
    const r = findVisibleRecipe(viewingId);
    if (r) fillRecipeView(r);
    else viewDialog.close();
  }

  $('#recommendList').addEventListener('click', async (e) => {
    const card = e.target.closest('[data-recipe]');
    if (card) {
      openRecipeView(card.dataset.recipe);
    } else if (e.target.closest('#restoreBuiltins')) {
      const ok = await askConfirm('숨긴 기본 레시피를 모두 다시 추천 목록에 보이게 할까요?', '다시 보이기');
      if (!ok) return;
      if (commit(() => { state.hiddenBuiltins = []; })) {
        renderAll();
        toast('숨긴 기본 레시피를 다시 보이게 했어요');
      }
    }
  });

  $('#viewBody').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-view]');
    if (!btn) return;
    const r = findVisibleRecipe(viewingId);
    const action = btn.dataset.view;

    if (action === 'close' || !r) {
      viewDialog.close();
    } else if (action === 'edit') {
      viewDialog.close();
      openRecipeDialog(r.id);
    } else if (action === 'hide') {
      const ok = await askConfirm(`‘${r.name}’ 기본 레시피를 추천에서 숨길까요?\n추천 목록 아래 ‘다시 보이기’로 언제든 되살릴 수 있어요.`, '숨기기');
      if (!ok) return;
      if (commit(() => { state.hiddenBuiltins.push(r.id); })) {
        viewDialog.close();
        renderAll();
        toast(`‘${r.name}’ 기본 레시피를 숨겼어요`);
      }
    } else if (action === 'delete') {
      const ok = await askConfirm(`‘${r.name}’ 레시피를 지울까요?\n지운 레시피는 되돌릴 수 없어요.`, '지우기');
      if (!ok) return;
      const saved = commit(() => {
        state.recipes = state.recipes.filter((x) => x.id !== r.id);
        // 기본 레시피를 고쳐 만든 레시피를 지우면, 원래 기본 레시피도 다시 나오지 않게 숨긴다
        if (r.fromBuiltin && !state.hiddenBuiltins.includes(r.fromBuiltin)) state.hiddenBuiltins.push(r.fromBuiltin);
      });
      if (saved) {
        viewDialog.close();
        renderAll();
        toast(`‘${r.name}’ 레시피를 지웠어요`);
      }
    }
  });

  // ---------- 확인 창 ----------
  const confirmDialog = $('#confirmDialog');
  let confirmResolve = null;

  function askConfirm(message, okLabel) {
    $('#confirmMessage').textContent = message;
    $('#confirmOk').textContent = okLabel;
    confirmDialog.showModal();
    $('#confirmCancel').focus(); // 실수로 Enter를 눌러도 지워지지 않도록
    return new Promise((resolve) => { confirmResolve = resolve; });
  }

  function finishConfirm(result) {
    if (confirmDialog.open) confirmDialog.close();
    if (confirmResolve) {
      const resolve = confirmResolve;
      confirmResolve = null;
      resolve(result);
    }
  }

  $('#confirmOk').addEventListener('click', () => finishConfirm(true));
  $('#confirmCancel').addEventListener('click', () => finishConfirm(false));
  // Esc로 닫은 경우. close 이벤트는 늦게 도착하므로, 그사이 새 확인 창이 열렸다면 무시한다.
  confirmDialog.addEventListener('close', () => {
    if (!confirmDialog.open) finishConfirm(false);
  });

  // ---------- 목록의 수정/삭제 버튼 ----------
  $('#ingredientList').addEventListener('click', async (e) => {
    const editBtn = e.target.closest('[data-edit]');
    const delBtn = e.target.closest('[data-del]');

    if (editBtn) {
      openIngredientDialog(editBtn.dataset.edit);
    } else if (delBtn) {
      const item = state.ingredients.find((i) => i.id === delBtn.dataset.del);
      if (!item) return;
      const expired = daysLeft(item.expiry) < 0;
      const ok = await askConfirm(
        expired
          ? `‘${item.name}’ 재료를 실제로 폐기하셨나요?\n확인하면 목록에서 지워집니다.`
          : `‘${item.name}’ 재료를 다 쓰셨나요?\n확인하면 목록에서 지워집니다.`,
        expired ? '폐기' : '지우기'
      );
      if (!ok) return;
      const saved = commit(() => {
        state.ingredients = state.ingredients.filter((i) => i.id !== item.id);
      });
      if (saved) {
        renderAll();
        toast(expired ? `‘${item.name}’ 폐기했어요` : `‘${item.name}’ 지웠어요`);
      }
    }
  });

  // ---------- 백업 저장 / 불러오기 ----------
  function getLS(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  function setLS(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* 알림용이라 실패해도 괜찮다 */ }
  }

  function backupData() {
    return {
      app: 'fridge-fairy',
      version: 1,
      exportedAt: new Date().toISOString(),
      ingredients: state.ingredients,
      recipes: state.recipes,
      hiddenBuiltins: state.hiddenBuiltins
    };
  }

  function downloadJson(filename, obj) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function exportBackup() {
    downloadJson(`냉장고요정-백업-${todayStr()}.json`, backupData());
    setLS(LAST_BACKUP_KEY, String(Date.now()));
    renderBackupReminder();
    toast(`백업 파일을 내려받았어요 (재료 ${state.ingredients.length}개, 레시피 ${state.recipes.length}개)`, 3000);
  }

  function renderBackupReminder() {
    const hasData = state.ingredients.length > 0 || state.recipes.length > 0;
    const last = Number(getLS(LAST_BACKUP_KEY)) || 0;
    const days = last ? Math.floor((Date.now() - last) / 86400000) : null;
    const show = hasData
      && (days === null || days >= BACKUP_REMIND_DAYS)
      && getLS(SNOOZE_KEY) !== todayStr();
    $('#backupReminder').hidden = !show;
    $('#backupReminderText').textContent = days === null
      ? '💾 아직 백업 파일을 만든 적이 없어요. 기록이 지워지거나 컴퓨터를 바꿀 때를 대비해 백업해 두세요.'
      : `💾 마지막 백업 뒤로 ${days}일이 지났어요. 새로 입력한 내용을 지키려면 백업해 두세요.`;
  }

  $('#exportBtn').addEventListener('click', exportBackup);
  $('#backupNowBtn').addEventListener('click', exportBackup);
  $('#backupSnoozeBtn').addEventListener('click', () => {
    setLS(SNOOZE_KEY, todayStr());
    renderBackupReminder();
  });

  $('#importBtn').addEventListener('click', () => $('#importFile').click());

  $('#importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = ''; // 같은 파일을 다시 골라도 동작하도록
    if (!file) return;

    if (file.size > MAX_IMPORT_BYTES) {
      alert('파일이 너무 커요. 냉장고 요정에서 만든 백업 파일(.json)이 맞는지 확인해 주세요.');
      return;
    }
    let parsed;
    try {
      parsed = JSON.parse(await file.text());
    } catch (err) {
      alert('파일을 읽을 수 없어요. 냉장고 요정에서 만든 백업 파일(.json)을 골라 주세요.');
      return;
    }
    if (!parsed || parsed.app !== 'fridge-fairy') {
      alert('냉장고 요정 백업 파일이 아니에요. 💾 백업 저장으로 만든 파일을 골라 주세요.');
      return;
    }

    const { data, skipped } = sanitizeData(parsed);
    const when = typeof parsed.exportedAt === 'string' && !Number.isNaN(Date.parse(parsed.exportedAt))
      ? `${formatDate(localDateStr(new Date(parsed.exportedAt)))}에 만든 백업`
      : '백업 파일';
    const hasCurrent = state.ingredients.length > 0 || state.recipes.length > 0;
    const lines = [
      `${when}: 재료 ${data.ingredients.length}개, 레시피 ${data.recipes.length}개`,
      skipped ? `(내용이 잘못된 ${skipped}개 항목은 빼고 불러와요)` : '',
      '',
      hasCurrent
        ? `지금 앱의 재료 ${state.ingredients.length}개, 레시피 ${state.recipes.length}개를 이 내용으로 바꿀까요?\n바꾸기 전에 지금 내용을 백업 파일로 자동 저장해 둘게요.`
        : '이 내용을 불러올까요?'
    ].filter((l, i) => l || i === 2);
    const ok = await askConfirm(lines.join('\n'), '불러오기');
    if (!ok) return;

    if (hasCurrent) {
      downloadJson(`냉장고요정-불러오기전-자동백업-${todayStr()}.json`, backupData());
    }
    const saved = commit(() => {
      state.ingredients = data.ingredients;
      state.recipes = data.recipes;
      state.hiddenBuiltins = data.hiddenBuiltins;
    });
    if (saved) {
      setLS(LAST_BACKUP_KEY, String(Date.now())); // 불러온 내용은 백업 파일에 이미 있다
      renderAll();
      toast(`불러왔어요 (재료 ${data.ingredients.length}개, 레시피 ${data.recipes.length}개)`, 3000);
    }
  });

  // ---------- 자정이 지나면 색상 다시 계산 ----------
  let lastDay = todayStr();
  function refreshIfDayChanged() {
    const t = todayStr();
    if (t !== lastDay) {
      lastDay = t;
      renderAll();
    }
  }
  setInterval(refreshIfDayChanged, 60000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshIfDayChanged();
  });

  renderAll();
</script>
</body>
</html>
