    <rect x="116" y="316" width="32" height="24" rx="11"/>
    <rect x="172" y="316" width="32" height="24" rx="11"/>
  </g>

  <!-- 몸통 -->
  <rect x="96" y="98" width="128" height="226" rx="34" fill="url(#nyBody)" stroke="#2b2350" stroke-width="6"/>
  <line x1="99" y1="170" x2="221" y2="170" stroke="#2b2350" stroke-width="5" stroke-linecap="round"/>
  <rect x="200" y="124" width="9" height="30" rx="4.5" fill="#2b2350"/>
  <rect x="200" y="186" width="9" height="34" rx="4.5" fill="#2b2350"/>
  <rect x="110" y="112" width="12" height="40" rx="6" fill="#ffffff" opacity="0.75"/>

